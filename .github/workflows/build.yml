name: Nightly APK

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      APP_VARIANT: preview
      T3CODE_MOBILE_UPDATES_ENABLED: '0'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Find latest nightly
        id: nightly
        run: |
          tag=$(gh api 'repos/pingdotgg/t3code/releases?per_page=100' --jq '[.[] | select(.draft == false and (.tag_name | contains("-nightly.")))] | max_by(.published_at) | .tag_name')
          test "$tag" != null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          if jq -e --arg tag "$tag" 'any(.[]; .tag_name == $tag and any(.assets[]; .name == "t3code.apk"))' <<< "$releases"; then
            echo 'Build already published.'
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.nightly.outputs.build == 'true'
        with:
          repository: pingdotgg/t3code
          ref: ${{ steps.nightly.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        if: steps.nightly.outputs.build == 'true'
        with:
          node-version: '24'

      - uses: actions/setup-java@v5
        if: steps.nightly.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        if: steps.nightly.outputs.build == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter @t3tools/mobile...
          cp .env.example .env

      - name: Configure standalone APK
        if: steps.nightly.outputs.build == 'true'
        working-directory: apps/mobile
        env:
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
        run: |
          mv app.config.ts upstream.config.ts
          cat > app.config.ts <<'EOF'
          import config from './upstream.config';
          export default {
            ...config,
            name: 'T3 Code Nightly APK',
            version: process.env.NIGHTLY_TAG!.replace(/^v/, ''),
            android: {
              ...config.android,
              package: 'com.abcamiletto.t3code.nightly',
              versionCode: Number(process.env.GITHUB_RUN_NUMBER),
            },
          };
          EOF
          pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        if: steps.nightly.outputs.build == 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Sign and verify
        if: steps.nightly.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/signing.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --out t3code.apk apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --verbose t3code.apk
          sha256sum t3code.apk > SHA256SUMS

      - name: Publish
        if: steps.nightly.outputs.build == 'true'
        env:
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
        run: |
          printf 'Unofficial standalone APK built from https://github.com/pingdotgg/t3code/releases/tag/%s\n\nPackage: com.abcamiletto.t3code.nightly. OTA updates disabled.\n' "$NIGHTLY_TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$NIGHTLY_TAG" t3code.apk SHA256SUMS --repo "$GITHUB_REPOSITORY" --target main --title "T3 Code $NIGHTLY_TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
