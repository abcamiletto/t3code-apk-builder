name: Nightly APK

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
      T3CODE_MOBILE_UPDATES_ENABLED: '0'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Find latest nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api 'repos/pingdotgg/t3code/releases?per_page=100' --jq '[.[] | select(.draft == false and (.tag_name | contains("-nightly.")))] | max_by(.published_at) | .tag_name')
          test "$tag" != null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          release_tag="$tag-apk.2"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          if jq -e --arg tag "$release_tag" 'any(.[]; .tag_name == $tag and any(.assets[]; .name == "t3code.apk"))' <<< "$releases"; then
            echo 'Build already published.'
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Download tagged source
        if: steps.nightly.outputs.build == 'true'
        env:
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
        run: curl -fL "https://api.github.com/repos/pingdotgg/t3code/tarball/$NIGHTLY_TAG" | tar xz --strip-components=1

      - uses: actions/setup-node@v6
        if: steps.nightly.outputs.build == 'true'
        with:
          node-version: '24'

      - uses: actions/setup-java@v5
        if: steps.nightly.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        if: steps.nightly.outputs.build == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter @t3tools/mobile... --filter @t3tools/scripts...
          cp .env.example .env

      - name: Make pink launcher icon
        if: steps.nightly.outputs.build == 'true'
        working-directory: scripts
        run: |
          node --input-type=module <<'JS'
          import sharp from 'sharp';
          const assets = '../apps/mobile/assets/';
          const foreground = assets + 'android-icon-foreground.png';
          const { width, height } = await sharp(foreground).metadata();
          await sharp({ create: { width, height, channels: 4, background: '#EC4899' } })
            .composite([{ input: foreground }]).png().toFile(assets + 'nightly-pink.png');
          JS

      - name: Configure standalone APK
        if: steps.nightly.outputs.build == 'true'
        working-directory: apps/mobile
        env:
          NIGHTLY_TAG: ${{ steps.nightly.outputs.release_tag }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('app.config.ts')
          source = path.read_text()
          assert 'export default config;' in source
          source = source.replace('export default config;', """
          config.name = 'T3 Code Nightly APK';
          config.version = process.env.NIGHTLY_TAG!.replace(/^v/, '');
          config.android = {
            ...config.android,
            icon: './assets/nightly-pink.png',
            adaptiveIcon: {
              ...config.android!.adaptiveIcon,
              backgroundColor: '#EC4899',
              backgroundImage: undefined,
            },
            versionCode: Number(process.env.GITHUB_RUN_NUMBER),
          };
          export default config;
          """)
          path.write_text(source)
          PYTHON
          pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        if: steps.nightly.outputs.build == 'true'
        working-directory: apps/mobile/android
        env:
          NIGHTLY_TAG: ${{ steps.nightly.outputs.release_tag }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Sign and verify
        if: steps.nightly.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/signing.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --out t3code.apk apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --verbose t3code.apk
          sha256sum t3code.apk > SHA256SUMS

      - name: Publish
        if: steps.nightly.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
        run: |
          printf 'Unofficial standalone APK built from https://github.com/pingdotgg/t3code/releases/tag/%s\n\nPackage: com.t3tools.t3code.preview. OTA updates disabled.\n' "$NIGHTLY_TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "${NIGHTLY_TAG}-apk.2" t3code.apk SHA256SUMS --repo "$GITHUB_REPOSITORY" --target main --title "T3 Code $NIGHTLY_TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
